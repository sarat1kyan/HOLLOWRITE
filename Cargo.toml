[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/game-core",
    "crates/persistence",
    "crates/server",
    "crates/terminal-client",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sarat1kyan/HOLLOWRITE"

[workspace.dependencies]
hollowrite-protocol = { path = "crates/protocol" }
hollowrite-game-core = { path = "crates/game-core" }
hollowrite-persistence = { path = "crates/persistence" }
hollowrite-test-support = { path = "crates/test-support" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
ratatui = "0.29"
unicode-width = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
rpassword = "7"
dirs = "6"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
