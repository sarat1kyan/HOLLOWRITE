# Enemy templates. Distances in milli-cells, durations in ticks (30/s).
# Shapes: arc (cone from the body), line (thrust), circle (around a point
# `offset` ahead), target_circle (centred on the target when the windup
# starts), projectile, ring (boss shockwave volley).

